<div
  class="banner w-full py-3 bg-primary flex items-center justify-center lg:py-4"
>
  <p class="banner__text text-xs font-semibold text-foreground lg:text-base">
    Free Shipping with minimum purchase Rs.250
  </p>
</div>

<header class="header container relative">
  <div class="flex flex-col gap-6">
    <!-- main header -->
    <div class="flex items-center justify-between p-1">
      <div class="logo">
        <img
          src="/img/logo.svg"
          alt="logo of ecocart"
          class="aspect-[5/2] h-6 md:h-9 lg:h-12"
        />
      </div>
      <!-- search bar for large screens -->
      <div
        class="border-2 border-border rounded-[40px] hidden lg:flex lg:items-center lg:gap-2 py-2 px-3 w-[70%] max-w-4xl"
      >
        <i class="ri-search-line text-gray-400"></i>
        <input
          type="search"
          name="search"
          id="search"
          placeholder="Search here... "
          class="outline-none w-full text-base text-gray-800"
        />
      </div>
      <nav class="search-header__nav flex items-center gap-4">
        <a
          href="#"
          class="search-header__nav-link transform duration-300 hover:-translate-y-1.5 lg:size-10 lg:flex lg:items-center lg:justify-center"
        >
          <i class="ri-user-3-line"></i>
        </a>
        <a
          href="#"
          class="search-header__nav-link transform duration-300 hover:-translate-y-1.5 lg:size-10 lg:flex lg:items-center lg:justify-center"
        >
          <i class="ri-shopping-bag-4-line"></i>
        </a>
      </nav>
    </div>
    <!-- search header for mobile screens-->
    <div class="flex items-center justify-between gap-3 lg:hidden">
      <div
        class="border-2 border-border rounded-[40px] flex items-center gap-2 py-2 px-3 w-[90%]"
      >
        <i class="ri-search-line text-gray-400"></i>
        <input
          type="search"
          name="mobile-search"
          id="mobile-search"
          placeholder="Search here... "
          class="outline-none w-full text-xs text-gray-800"
        />
      </div>
      <button
        class="size-10 flex items-center justify-center rounded-full hover:bg-gray-200 transition-all"
        (click)="toggleMobileMenu()"
      >
        <i #hamburger class="ri-menu-fill text-lg"></i>
      </button>
    </div>

    <!--mobile menu -->
    <div
      class="mobile-navigation bg-background absolute top-full inset-x-0 z-10"
      *ngIf="isMenuVisible()"
    >
      <ul>
        <li class="mobile-navigation-item">
          <a href="#" class="mobile-navigation-link">Home</a>
        </li>
        <li class="mobile-navigation-item">
          <a href="#" class="mobile-navigation-link">About</a>
        </li>
        <li class="mobile-navigation-item">
          <a href="#" class="mobile-navigation-link">Shop</a>
        </li>
        <li class="mobile-navigation-item">
          <a href="#" class="mobile-navigation-link">Blog</a>
        </li>
        <li class="mobile-navigation-item">
          <a href="#" class="mobile-navigation-link">Contact</a>
        </li>
      </ul>
    </div>

    <!-- large screen menu -->
    <div class="header__navigation bg-background hidden lg:block">
      <ul class="flex items-center justify-center gap-4">
        <li class="header__navigation-item rounded-lg">
          <a
            href="#"
            class="header__navigation-link block px-4 py-2 text-base font-semibold text-gray-800"
            >NEW!</a
          >
        </li>
        <li class="header__navigation-item rounded-lg">
          <a
            href="#"
            class="header__navigation-link block px-4 py-2 text-base font-semibold text-gray-800"
            >Clothing</a
          >
        </li>
        <li class="header__navigation-item rounded-lg">
          <a
            href="#"
            class="header__navigation-link block px-4 py-2 text-base font-semibold text-gray-800"
            >Bath</a
          >
        </li>
        <li class="header__navigation-item rounded-lg">
          <a
            href="#"
            class="header__navigation-link block px-4 py-2 text-base font-semibold text-gray-800"
            >Bedding</a
          >
        </li>
        <li class="header__navigation-item rounded-lg">
          <a
            href="#"
            class="header__navigation-link block px-4 py-2 text-base font-semibold text-gray-800"
            >Home Goods</a
          >
        </li>
        <li class="header__navigation-item rounded-lg">
          <a
            href="#"
            class="header__navigation-link block px-4 py-2 text-base font-semibold text-gray-800"
            >Furniture</a
          >
        </li>
        <li class="header__navigation-item rounded-lg">
          <a
            href="#"
            class="header__navigation-link block px-4 py-2 text-base font-semibold text-gray-800"
            >Footwear</a
          >
        </li>
        <li class="header__navigation-item rounded-lg">
          <a
            href="#"
            class="header__navigation-link block px-4 py-2 text-base font-semibold text-gray-800"
            >Accessories</a
          >
        </li>
      </ul>
    </div>
  </div>
</header>
